<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>
<title>ONE BITE HIGHER</title>
<link rel="icon" href="img/favicon.png">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
/* 레이아웃: 게임 화면처럼 진남색 바탕 + 스테이지 색 포인트, 단일 다크 룩 */
:root{
  --ink:#1A1A2E; --deep:#0B0B14; --panel:#23234A; --line:#33335A;
  --yellow:#FFC21A; --pink:#FF5C9A; --cyan:#4FD8FF; --green:#3FE0A0; --red:#FF4A2B; --blue:#2F6BFF;
  --text:#FFFFFF; --muted:#A9AFCC;
  --px:'Press Start 2P',ui-monospace,monospace; --body:'Noto Sans KR',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--ink);color:var(--text);font-family:var(--body);font-size:15px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--ink)}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
:focus-visible{outline:3px solid var(--yellow);outline-offset:3px}
img{display:block}
.px{font-family:var(--px);letter-spacing:.02em;line-height:1.5}
.pixel{image-rendering:pixelated}
.wrap{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sec{padding-block:56px 24px}
.sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.sec-title{font-family:var(--px);font-size:15px;margin:0}
.more{font-size:14px;color:var(--muted)}
.more:hover{color:var(--yellow)}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--ink);border-bottom:4px solid var(--deep)}
.top .wrap{display:flex;align-items:center;gap:20px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--px);font-size:11px;color:var(--yellow)}
.brand img{width:34px}
nav.menu{display:flex;gap:4px;flex:1;justify-content:center;flex-wrap:wrap}
nav.menu a{font-family:var(--px);font-size:10px;padding:10px 12px;border:3px solid transparent}
nav.menu a.on{border-color:var(--yellow);color:var(--yellow)}
nav.menu a:hover{color:var(--yellow)}
.cart-btn{display:flex;align-items:center;gap:8px;font-family:var(--px);font-size:10px;padding:8px 10px;border:3px solid var(--text)}
.cart-btn b{color:var(--yellow)}

/* hero */
.hero{position:relative;overflow:hidden;background:#7EC8FF url(img/bg1.jpg) center 70%/cover no-repeat;image-rendering:pixelated}
.hero .wrap{position:relative;min-height:500px;display:flex;flex-direction:column;align-items:center;gap:20px;padding-block:20px 0}
.hud{align-self:stretch;display:flex;justify-content:space-between;align-items:center}
.hud .hearts{display:flex;gap:6px}.hud .hearts img{width:24px}
.hud .alt{font-family:var(--px);font-size:10px;background:#fff;color:var(--ink);padding:8px 10px;border:3px solid var(--ink)}
.hero-logo{width:min(500px,80%);margin-top:6px}
.hero-btns{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}
.btn{font-family:var(--px);font-size:11px;padding:14px 16px;border:4px solid var(--ink);background:var(--yellow);color:var(--ink);display:inline-flex;gap:8px;align-items:center}
.btn.dark{background:var(--ink);color:#fff;border-color:#fff}
.btn:hover{transform:translate(-2px,-2px);box-shadow:4px 4px 0 var(--ink)}
.cast{display:flex;justify-content:center;align-items:flex-end;gap:clamp(30px,10vw,120px);margin-top:auto}
.cast img{width:64px}
.floaty{position:absolute;width:52px}
.ground{height:40px;background:url(img/tile1.png) left top/auto 100% repeat-x;image-rendering:pixelated}
.ground.s2{background-image:url(img/tile2.png)}.ground.s3{background-image:url(img/tile3.png)}
.ground.move{animation:scroll 6s steps(24) infinite linear}
@keyframes scroll{to{background-position-x:-384px}}
@keyframes hop{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-30px)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes blink{50%{opacity:0}}
.hop{animation:hop 1.4s steps(6) infinite}.hop.d1{animation-delay:.45s}.hop.d2{animation-delay:.9s}
.float{animation:float 2.4s steps(4) infinite}.float.d1{animation-delay:1.2s}
.blink{animation:blink 1s steps(1) infinite}

/* overlays */
.overlay{position:fixed;inset:0;z-index:100;background:rgba(11,11,20,.78);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.trailer{position:relative;width:min(860px,100%)}
.screen{position:relative;aspect-ratio:16/9;max-width:100%;border:6px solid var(--yellow);background:#000;overflow:hidden;box-shadow:10px 10px 0 var(--deep)}
.screen img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .6s steps(3)}
.screen img.on{opacity:1}
.screen .tag{position:absolute;left:12px;top:12px;font-family:var(--px);font-size:9px;background:var(--red);padding:6px 8px;z-index:2}
.screen .bar{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:10px 14px;background:rgba(11,11,20,.8);display:flex;gap:12px;align-items:center;font-family:var(--px);font-size:9px}
.screen .prog{flex:1;height:8px;background:#3A3A50}.screen .prog i{display:block;height:100%;width:0;background:var(--yellow)}
.x{position:absolute;top:-20px;right:-14px;width:48px;height:48px;background:var(--red);border:4px solid #fff;display:flex;align-items:center;justify-content:center;z-index:3}
.screen video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000;cursor:pointer}
.tbar{display:flex;align-items:center;gap:12px;margin-top:10px;background:var(--deep);border:4px solid var(--yellow);padding:10px 12px;font-family:var(--px);font-size:9px;color:#fff}
.tbar button{font-family:var(--px);font-size:10px;color:var(--yellow);min-width:34px;height:30px;border:2px solid var(--yellow);background:transparent}
.tbar button:hover{background:var(--yellow);color:var(--ink)}
.tbar .tprog{flex:1;height:12px;background:#3A3A50;cursor:pointer;position:relative}.tbar .tprog i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--yellow)}
.tbar .tt{min-width:84px;text-align:right}
#tbox:fullscreen{display:flex;flex-direction:column;width:100vw;height:100vh;background:#000;padding:0}
#tbox:fullscreen .screen{flex:1;aspect-ratio:auto;border:0;box-shadow:none}
#tbox:fullscreen .tbar{margin:0;border-width:4px 0 0}#tbox:fullscreen .tag{display:none}
#tbox:-webkit-full-screen{display:flex;flex-direction:column;width:100vw;height:100vh;background:#000}
#tbox:-webkit-full-screen .screen{flex:1;aspect-ratio:auto;border:0;box-shadow:none}
#tbox:-webkit-full-screen .tbar{margin:0;border-width:4px 0 0}
.skip{margin-top:12px;font-family:var(--px);font-size:10px;color:#fff;padding:8px 0}

.loading{position:fixed;inset:0;z-index:200;background:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px}
.loading[hidden]{display:none}
.loading .ladder{position:relative;width:80px;height:220px}
.loading .ladder::before{content:"";position:absolute;left:18px;top:0;bottom:0;width:44px;border-left:6px solid var(--pink);border-right:6px solid var(--pink);background:repeating-linear-gradient(180deg,transparent 0 26px,var(--pink) 26px 32px)}
.loading .ladder img{position:absolute;left:10px;bottom:0;width:60px;animation:climb 1.6s steps(8) infinite}
@keyframes climb{to{transform:translateY(-160px)}}
.loading .pbar{width:min(340px,80vw);height:24px;border:4px solid #fff;padding:3px}.loading .pbar i{display:block;height:100%;background:var(--yellow);animation:fill 1.6s steps(10) forwards}
@keyframes fill{from{width:0}to{width:100%}}

/* news */
.news{list-style:none;margin:0;padding:0;border-top:3px solid var(--line)}
.news li{border-bottom:3px solid var(--line)}
.news a{display:flex;flex-wrap:wrap;gap:16px;align-items:center;padding:14px 0}
.news .d{font-family:var(--px);font-size:9px;color:var(--muted)}
.news .t{font-family:var(--px);font-size:8px;color:var(--ink);padding:6px 8px;min-width:58px;text-align:center}
.news .ti{flex:1 1 240px;font-weight:700;font-size:16px;min-width:0}

/* inventory */
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.slot{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 4px 10px;border:4px solid var(--deep);box-shadow:4px 4px 0 var(--deep);color:var(--ink);transition:transform .1s}
.slot .ic{height:56px;display:flex;align-items:center}
.slot .nm{font-weight:900;font-size:14px}
.slot .fd{font-family:var(--px);font-size:7px}
.slot.on{transform:translateY(-6px);box-shadow:0 0 0 4px var(--yellow),6px 6px 0 var(--yellow)}
.slot:hover .ic img{animation:hop .8s steps(4) infinite}
.bag{margin-top:18px;background:var(--deep);border:4px solid var(--yellow);padding:24px}
.bag-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.bag-head img{width:36px}
.bag-head strong{font-size:21px;font-weight:900}
.chip{font-family:var(--px);font-size:9px;background:var(--yellow);color:var(--ink);padding:6px 8px}

/* product grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px}
.card{display:flex;flex-direction:column;gap:8px;text-align:left}
.card .ph{aspect-ratio:1/1;max-width:100%;border:4px solid #fff;overflow:hidden;background:var(--panel)}
.card .ph img{width:100%;height:100%;object-fit:cover;transition:transform .2s}
.card:hover .ph img{transform:scale(1.04)}
.card .nm{font-weight:700;font-size:15px}
.card .pr{font-family:var(--px);font-size:9px;color:var(--yellow)}

/* lookbook */
.strip{display:flex;gap:14px;overflow-x:auto;padding-bottom:12px;scroll-snap-type:x mandatory}
.look{flex:0 0 min(280px,75vw);scroll-snap-align:start;display:flex;flex-direction:column;gap:8px;text-align:left}
.look .ph{aspect-ratio:4/5;border:4px solid #fff;overflow:hidden;background:var(--deep)}
.look .ph img{width:100%;height:100%;object-fit:cover}
.look .cap{font-weight:700}
.look .tg{font-family:var(--px);font-size:8px}
.lookgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.lookgrid .look{flex:none}

/* making */
.logs{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.log{background:var(--deep);border:4px solid var(--cyan);display:flex;flex-direction:column;text-align:left}
.log .ph{aspect-ratio:16/10;background:#F4F1EA;border-bottom:4px solid var(--cyan)}
.log .ph img{width:100%;height:100%;object-fit:contain}
.log .bd{padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.log .no{font-family:var(--px);font-size:8px;color:var(--cyan)}
.log .ti{font-weight:700}

/* downloads */
.dls{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.dl{background:var(--deep);border:4px solid var(--green);padding:16px;display:flex;gap:14px;align-items:center;text-align:left}
.dl img{width:36px}
.dl .t{flex:1;min-width:0;display:flex;flex-direction:column}
.dl .t b{font-size:15px}.dl .t span{font-family:var(--px);font-size:8px;color:var(--green);margin-top:6px}
.dl .go{font-family:var(--px);color:var(--green)}
.gdl{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;margin-bottom:18px}
.gcard{background:var(--deep);border:4px solid var(--yellow);padding:18px;display:flex;gap:16px;align-items:center}
.gcard img{width:84px;height:84px;flex:none;border-radius:20px}
.gcard .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.gcard .t b{font-size:17px}.gcard .t small{color:var(--muted);font-size:12px}
.gcard .os{display:flex;gap:8px;flex-wrap:wrap}
.gcard .os button,.gcard .os a{font-family:var(--px);font-size:9px;padding:9px 12px;border:3px solid var(--yellow);color:var(--yellow);background:transparent;text-decoration:none}
.gcard .os button:hover,.gcard .os a:hover{background:var(--yellow);color:var(--ink)}
.gcard .os a.play{font-size:12px;padding:12px 22px;background:var(--yellow);color:var(--ink)}
.gcard .os a.play:hover{background:#fff;border-color:#fff}
.note{margin-top:12px;font-size:13px;color:var(--muted)}

/* modal */
.pm{position:relative;width:min(980px,100%);max-height:100%;overflow:auto;background:var(--ink);border:4px solid var(--yellow);display:flex;flex-wrap:wrap}
.pm .big{flex:1 1 420px;min-width:0;background:var(--panel)}
.pm .big img{width:100%;max-height:70vh;object-fit:contain}
.pm .info{flex:1 1 300px;min-width:0;padding:28px;display:flex;flex-direction:column;gap:14px}
.pm .thumbs{display:flex;gap:8px;flex-wrap:wrap}
.pm .thumbs button{width:64px;height:64px;border:3px solid var(--line);overflow:hidden}
.pm .thumbs button.on{border-color:var(--yellow)}
.pm .thumbs img{width:100%;height:100%;object-fit:cover}
.pm h2{margin:0;font-size:24px;font-weight:900;text-wrap:balance}
.pm .x{top:10px;right:10px}
.toast{position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:300;background:var(--yellow);color:var(--ink);font-family:var(--px);font-size:10px;padding:12px 16px;border:4px solid var(--ink)}

/* cart */
.cart{position:fixed;top:0;right:0;bottom:0;z-index:120;width:min(380px,100%);background:var(--ink);border-left:4px solid var(--yellow);padding:max(20px,env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) 20px 20px;display:flex;flex-direction:column;gap:14px}
.cart ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;overflow:auto;flex:1}
.cart li{display:flex;gap:10px;align-items:center}
.cart li img{width:52px;height:52px;object-fit:cover;border:3px solid #fff}
.cart li span{flex:1;min-width:0;font-weight:700;font-size:14px}
.cart li button{font-family:var(--px);font-size:9px;color:var(--muted)}


.asg{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.as{background:var(--deep);border:3px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 6px 10px;text-align:center}
.as:hover{border-color:var(--yellow)}
.as .ic{height:84px;display:flex;align-items:center;justify-content:center}
.as .ic img{max-width:84px;max-height:84px;image-rendering:pixelated}
.as span{font-size:12px;color:var(--muted)}
.asec{margin-top:36px}.asec h2{font-family:var(--px);font-size:13px;margin:0 0 4px}.asec p{margin:0 0 14px;color:var(--muted);font-size:14px}
.stg{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.stg button{display:flex;flex-direction:column;text-align:left;border:4px solid #fff;background:var(--deep)}
.stg img.s{width:100%;aspect-ratio:16/9;object-fit:cover;image-rendering:pixelated}
.stg .tl{height:28px;background-size:auto 100%;background-repeat:repeat-x;image-rendering:pixelated}
.stg .bd{padding:10px 14px}
.zoom img{image-rendering:pixelated;background:var(--panel);min-height:240px;object-fit:contain!important;padding:24px}

/* 404 */
.go404{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;text-align:center;background:#05051A;padding-block:40px}
.go404 h1{font-family:var(--px);font-size:clamp(32px,8vw,64px);color:var(--red);margin:0;text-shadow:5px 5px 0 #5A1010}

footer{margin-top:48px}
footer .bot{background:#1E2A5A;padding-block:28px}
footer .bot .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:center}

@media (max-width:640px){
  nav.menu{order:3;flex-basis:100%;justify-content:flex-start;overflow-x:auto;flex-wrap:nowrap}
  .floaty{display:none}.cast img{width:52px}
}
@media (prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition:none!important}}
</style>

<div id="loading" class="loading" aria-label="로딩 중">
  <div class="ladder"><img class="pixel" src="img/helmet_climb_0.png" alt=""></div>
  <span class="px" style="font-size:14px;color:var(--yellow)">NOW CLIMBING<span class="blink">...</span></span>
  <div class="pbar"><i></i></div>
  <span style="color:var(--muted);font-size:14px;text-align:center;padding:0 16px">TIP · 우유를 먹으면 뼈가 튼튼해져서 높은 데서 떨어져도 버텨요</span>
</div>

<header class="top">
  <div class="wrap">
    <a class="brand" href="#home" data-go="home"><img class="pixel" src="img/mark.png" alt="">ONE BITE HIGHER</a>
    <nav class="menu" aria-label="메인 메뉴">
      <a href="#home" data-go="home">HOME</a>
      <a href="#shop" data-go="shop">SHOP</a>
      <a href="#lookbook" data-go="lookbook">LOOKBOOK</a>
      <a href="#assets" data-go="assets">ASSETS</a>
      <a href="#play" data-go="play">PLAY</a>
      <a href="#free" data-go="free">DOWNLOAD</a>
    </nav>
    <button class="cart-btn" id="cartBtn" aria-label="장바구니 열기">CART <b id="cartN">0</b></button>
  </div>
</header>

<main id="app"></main>

<footer>
  <div class="ground s3"></div>
  <div class="bot"><div class="wrap">
    <a class="px" style="font-size:11px" href="#home" data-go="home"><span class="blink">▶</span> CONTINUE?</a>
    <span style="color:var(--muted);font-size:13px">© 2026 ONE BITE HIGHER · 한입 더 높이</span>
  </div></div>
</footer>

<div id="layer"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
const GAME_URL='game/ko.html';
const GAME_URL_EN='game/en.html';
const GDL=[['ko','한국어판','한입 더 높이 · 브라우저에서 바로 플레이',GAME_URL],['en','English','ONE BITE HIGHER · Play in your browser',GAME_URL_EN]];
const I=f=>'img/'+f;
const CATS=[
 {id:'bag',name:'가방',food:'BENTO',bg:'#CFE7FF',icon:'bento.png',w:54,items:[['빅 캐릭터 에코백 · 헬멧','tote_big1.jpg',['wear1.jpg']],['빅 캐릭터 에코백 · 비니','tote_big2.jpg',['tote_wear.jpg']],['빅 캐릭터 에코백 · 가이드','tote_big3.jpg',['wear3.jpg']]]},

function go(v,push=true){
  if(!VIEWS[v])v='notfound';
  $('#app').innerHTML=VIEWS[v]();
  document.querySelectorAll('nav.menu a').forEach(a=>a.classList.toggle('on',a.dataset.go===v));
  if(push){try{history.replaceState(null,'','#'+v)}catch(e){}}
  window.scrollTo(0,0);
}

    <div id="tbox"><div class="screen"><video id="tv" src="${TRAILER_SRC}" autoplay muted playsinline preload="auto"></video><span class="tag blink">● TRAILER</span></div>
    <div class="tbar"><button id="tPlay" aria-label="재생/일시정지">❚❚</button><button id="tMute" aria-label="소리 켜기">♪ OFF</button>
      <span class="tprog" id="tProg" role="slider" aria-label="재생 위치"><i id="prog"></i></span><span class="tt" id="tTime">0:00 / 1:00</span><button id="tFull" aria-label="전체 화면">⛶</button></div></div>
    <button class="x" data-act="close" aria-label="트레일러 닫기"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5L19 19M19 5L5 19" stroke="#fff" stroke-width="4"></path></svg></button>
    <button class="skip" data-act="close">SKIP ▶▶</button></div></div>`;
    const v=$('#tv'),bar=$('#prog'),tm=$('#tTime'),pl=$('#tPlay'),mu=$('#tMute');
    const f=t=>Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0');
    const tick=()=>{if(!document.body.contains(v))return;const d=v.duration||60;bar.style.width=(v.currentTime/d*100)+'%';tm.textContent=f(v.currentTime)+' / '+f(d);requestAnimationFrame(tick)};
    requestAnimationFrame(tick);
    const sync=()=>{pl.textContent=v.paused?'▶':'❚❚';mu.textContent=v.muted?'♪ OFF':'♪ ON'};
    v.addEventListener('play',sync);v.addEventListener('pause',sync);v.addEventListener('volumechange',sync);
    v.addEventListener('click',()=>v.paused?v.play():v.pause());
    pl.onclick=()=>v.paused?v.play():v.pause();
    mu.onclick=()=>{v.muted=!v.muted;if(!v.muted&&v.paused)v.play()};
    $('#tProg').onclick=e=>{const r=e.currentTarget.getBoundingClientRect();v.currentTime=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*(v.duration||60)};
    $('#tFull').onclick=()=>{const box=$('#tbox');const cur=document.fullscreenElement||document.webkitFullscreenElement;
      if(cur){(document.exitFullscreen||document.webkitExitFullscreen).call(document);return}
      const fs=box.requestFullscreen||box.webkitRequestFullscreen;if(fs)fs.call(box);else if(v.webkitEnterFullscreen)v.webkitEnterFullscreen()};
    v.play().catch(()=>{});sync();clearInterval(slideT);return;
  }
  $('#layer').innerHTML=`<div class="overlay" id="tr" role="dialog" aria-label="트레일러"><div class="trailer">
    <div class="screen">${TRAILER_SRC?`<video src="${TRAILER_SRC}" autoplay muted playsinline controls style="width:100%;height:100%"></video>`:shots.map((s,i)=>`<img class="pixel${i?'':' on'}" src="img/${s}" alt="">`).join('')}
      <span class="tag blink">● TRAILER</span>
      <div class="bar"><span>${TRAILER_SRC?'':'COMING SOON'}</span><span class="prog"><i id="prog"></i></span><span>1:00</span></div></div>
    <button class="x" data-act="close" aria-label="트레일러 닫기"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5L19 19M19 5L5 19" stroke="#fff" stroke-width="4"></path></svg></button>
    <button class="skip" data-act="close">SKIP ▶▶</button></div></div>`;
  let k=0,p=0;clearInterval(slideT);
  slideT=setInterval(()=>{p=(p+1)%100;const b=$('#prog');if(!b){clearInterval(slideT);return}b.style.width=p+'%';if(p%33===0){k=(k+1)%3;document.querySelectorAll('.screen img').forEach((im,i)=>im.classList.toggle('on',i===k))}},100);
}
function closeLayer(){clearInterval(slideT);$('#layer').innerHTML=''}

function openProduct(id){
  const p=PRODUCTS.find(x=>x.id===id);if(!p)return;const c=CATS.find(x=>x.id===p.cat);
  $('#layer').innerHTML=`<div class="overlay" role="dialog" aria-label="${esc(p.name)}"><div class="pm">
   <div class="big"><img id="pmBig" src="${I(p.img)}" alt="${esc(p.name)}"></div>
   <div class="info"><span class="chip" style="align-self:flex-start;background:${c.bg}">${c.name} · ${c.food}</span><h2>${esc(p.name)}</h2>
    <span class="px" style="font-size:12px;color:var(--yellow)">[가격]원</span>
    <p style="margin:0;color:var(--muted)">ONE BITE HIGHER 공식 굿즈예요. 상세 정보는 준비 중이에요.</p>
    ${p.imgs.length>1?`<div class="thumbs">${p.imgs.map((m,i)=>`<button data-thumb="${m}" class="${i?'':'on'}" aria-label="사진 ${i+1}"><img src="${I(m)}" alt=""></button>`).join('')}</div>`:''}
    <button class="btn" data-add="${p.id}" style="align-self:flex-start">+ 장바구니 담기</button></div>
   <button class="x" data-act="close" aria-label="닫기"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5L19 19M19 5L5 19" stroke="#fff" stroke-width="4"></path></svg></button></div></div>`;
}
function openImage(img,cap,zoom){
  $('#layer').innerHTML=`<div class="overlay" role="dialog" aria-label="${cap}"><div class="pm" style="flex-direction:column"><div class="big${zoom?' zoom':''}" style="flex:none"><img src="${I(img)}" alt="${cap}"></div><div class="info" style="flex:none;padding:16px 20px"><strong>${cap}</strong></div><button class="x" data-act="close" aria-label="닫기"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5L19 19M19 5L5 19" stroke="#fff" stroke-width="4"></path></svg></button></div></div>`;
}
function openCart(){
  const items=cart.map((id,i)=>{const p=PRODUCTS.find(x=>x.id===id);return p?`<li><img src="${I(p.img)}" alt=""><span>${esc(p.name)}</span><button data-rm="${i}">빼기</button></li>`:''}).join('');
  $('#layer').innerHTML=`<div class="overlay" data-act="close" style="justify-content:flex-end;padding:0"></div><aside class="cart" role="dialog" aria-label="장바구니">
   <div style="display:flex;justify-content:space-between;align-items:center"><span class="px" style="font-size:13px;color:var(--yellow)">INVENTORY</span><button data-act="close" class="px" style="font-size:10px">닫기 ✕</button></div>
   ${cart.length?`<ul>${items}</ul><button class="btn" data-act="order">주문하기 (${cart.length})</button><p class="note" id="orderNote"></p>`:`<p style="color:var(--muted)">아직 담은 아이템이 없어요.</p><a class="btn" href="#shop" data-go="shop" style="align-self:flex-start">ITEM SHOP 가기</a>`}</aside>`;
}
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),1600)}

async function gameDownload(key){
  const note=$('#gNote');const say=t=>{if(note)note.textContent=t};
  const zipName='ONE_BITE_HIGHER_'+key.split('_')[0].toUpperCase()+'_'+key.split('_')[1]+'.zip';
  let dl=null;try{dl=window.claude&&await window.claude.use('downloads')}catch(e){}
  if(!dl){const a=document.createElement('a');a.href='dl/game/'+zipName;a.download=zipName;document.body.appendChild(a);a.click();a.remove();toast('GET! '+zipName);return}
  say('게임을 포장하는 중이에요…');
  try{
    const m=await (await fetch('dl/game/'+key+'.json')).json();
    const z=new JSZip();
    for(const f of m.files){z.file(f.p,f.t!=null?f.t:f.b,{base64:f.t==null,unixPermissions:f.m,date:new Date()})}
    const blob=await z.generateAsync({type:'blob',platform:'UNIX',compression:'DEFLATE'});
    await dl.save({filename:m.zip,data:blob});say('');toast('GET! '+m.zip);
  }catch(e){say(e&&e.code==='declined'?'저장을 취소했어요.':'게임 파일을 만들지 못했어요. 잠시 후 다시 눌러주세요.')}
}
async function download(i){
  const d=DLS[i];const note=$('#dlNote');const say=t=>{if(note)note.textContent=t};
  let dl=null;try{dl=window.claude&&await window.claude.use('downloads')}catch(e){}
  if(!dl){ // 내 컴퓨터에서 열었을 때: 파일을 하나씩 바로 내려받기
    for(const f of d[4]){const a=document.createElement('a');a.href=f;a.download=f.split('/').pop();document.body.appendChild(a);a.click();a.remove();await new Promise(r=>setTimeout(r,300))}
    say('');toast('GET! '+d[4].length+'개 파일');return}
  say('파일을 모으는 중이에요…');
  try{
    const files=await Promise.all(d[4].map(async f=>[f.split('/').pop(),await (await fetch(f)).blob()]));
    if(window.JSZip){
      const z=new JSZip();files.forEach(([n,b])=>z.file(n,b));
      try{await dl.save({filename:d[2],data:await z.generateAsync({type:'blob'})});say('');toast('GET! '+d[2]);return}
      catch(e){if(!e||(e.code!=='rejected_extension'&&e.code!=='extension_not_enabled'))throw e}
    }
    for(const [n,b] of files){await dl.save({filename:n,data:b})}
    say('');toast('GET! '+files.length+'개 파일');
  }catch(e){say(e&&e.code==='declined'?'저장을 취소했어요.':'파일을 저장하지 못했어요. 잠시 후 다시 눌러주세요.')}
}

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-go],[data-act],[data-cat],[data-shop],[data-p],[data-img],[data-dl],[data-gdl],[data-add],[data-thumb],[data-rm],#cartBtn');
  if(!t)return;
  if(t.id==='cartBtn'){openCart();return}
  if(t.dataset.go){e.preventDefault();closeLayer();go(t.dataset.go);return}
  const a=t.dataset.act;
  if(a==='trailer'){openTrailer();return}
  if(a==='close'){closeLayer();return}
  if(a==='order'){const n=$('#orderNote');if(n)n.textContent='결제는 아직 연결 전이에요. 오픈하면 여기서 바로 주문할 수 있어요.';return}
  if(t.dataset.cat!==undefined){state.cat=+t.dataset.cat;$('#invBody').innerHTML=inventory();return}
  if(t.dataset.shop){state.shopCat=t.dataset.shop;go('shop',false);return}
  if(t.dataset.p){openProduct(t.dataset.p);return}
  if(t.dataset.thumb){$('#pmBig').src=I(t.dataset.thumb);t.parentNode.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===t));return}
  if(t.dataset.add){cart.push(t.dataset.add);saveCart();toast('ITEM GET! 장바구니에 담았어요');closeLayer();return}
  if(t.dataset.rm!==undefined){cart.splice(+t.dataset.rm,1);saveCart();openCart();return}
  if(t.dataset.img){openImage(t.dataset.img,t.dataset.cap,t.dataset.zoom);return}
  if(t.dataset.dl!==undefined){download(+t.dataset.dl);return}
  if(t.dataset.gdl){gameDownload(t.dataset.gdl);return}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeLayer()});

saveCart();
const start=(location.hash||'#home').slice(1)||'home';
go(start,false);
setTimeout(()=>{$('#loading').hidden=true;if(start==='home')openTrailer()},1700);
</script>
</body>
</html>
