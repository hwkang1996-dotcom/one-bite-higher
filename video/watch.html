<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ONE BITE HIGHER · Trailer</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif}
  video{position:fixed;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
  #tap{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:18px;background:rgba(10,10,30,.55);color:#fff;cursor:pointer;border:0;width:100%;font:inherit}
  #tap .b{width:130px;height:130px;border-radius:50%;background:#FFC21A;display:flex;align-items:center;justify-content:center}
  #tap .b:after{content:"";margin-left:12px;border-left:44px solid #1b1838;border-top:28px solid transparent;border-bottom:28px solid transparent}
  #tap .t{font-size:24px;font-weight:700}
  #tap .s{font-size:16px;color:#c9c9e6}
  #snd{position:fixed;right:24px;bottom:24px;display:none;padding:12px 18px;border-radius:10px;border:0;background:#FFC21A;color:#1b1838;font:700 16px system-ui;cursor:pointer}
</style>
</head>
<body>
<video id="v" src="trailer.mp4" playsinline preload="auto"></video>
<button id="tap"><span class="b"></span><span class="t">클릭해서 재생</span><span class="s">Click to play</span></button>
<button id="snd">🔊 소리 켜기 · Sound on</button>
<script>
const v=document.getElementById('v'),tap=document.getElementById('tap'),snd=document.getElementById('snd');
function start(){ v.muted=false; v.play().then(()=>{tap.style.display='none';snd.style.display='none';}).catch(()=>{tap.style.display='flex';}); }
tap.onclick=()=>{ v.muted=false; v.currentTime=v.currentTime; v.play(); tap.style.display='none'; snd.style.display='none'; };
snd.onclick=()=>{ v.muted=false; snd.style.display='none'; };
v.onclick=()=>{ v.paused?v.play():v.pause(); };
v.onended=()=>{ tap.querySelector('.t').textContent='다시 보기'; tap.querySelector('.s').textContent='Replay'; tap.style.display='flex'; };
document.addEventListener('keydown',e=>{ if(e.key===' '){e.preventDefault(); v.paused?(v.muted=false,v.play(),tap.style.display='none'):v.pause();} if(e.key==='f'){document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();} });
// Try playing with sound; if the browser blocks it, show the big play button.
v.addEventListener('canplay',start,{once:true});
</script>
</body>
</html>
