  g.restore();
  // foods eaten this run hop on the clouds
  if(t>2.6&&runFoods.length){const n=Math.min(10,runFoods.length);txt('Today\'s fuel',380,184,6,{align:'center',col:'#1A1A2E',bold:true});
    for(let i=0;i<n;i++){const ap=t-(2.7+i*0.12);if(ap<0)continue;const im=FOOD[runFoods[i]];const x=286+i*18;const pop=ap<0.2?Math.round((1-ap/0.2)*-14):0;const h=Math.abs(Math.sin(T*4+i*0.7))*5;
      g.drawImage(im,Math.round(x),Math.round(212-im.height-h+pop));}}
  for(const q of endP){g.fillStyle=q.col;g.globalAlpha=Math.min(1,q.life*2);g.fillRect(Math.round(q.x),Math.round(q.y),q.conf?2:2,q.conf?3:2);}g.globalAlpha=1;}

// 칭호: 이번 판에 가장 많이 먹은 영양소로 정해짐
const NUTRI={carb:['Carb Charger','#FFC21A'],protein:['Protein Lover','#FF6FB5'],fat:['Good-Fat Fan','#FF8A1A'],fiber:['Fiber Keeper','#12C48B'],calcium:['Calcium Collector','#8FD3FF'],iron:['Iron Climber','#FF6A5A'],candy:['Sugar Rush Alert','#FF3EA5']};
function nutriTitle(){
  // 맵에 나온 개수가 영양소마다 달라서(단백질 9 · 칼슘 3 등) 개수 대신 '나온 것 중 몇 %를 먹었나'로 비교
  const av={},ea={};for(const n in runAvail){for(const k in runAvail[n]){av[k]=(av[k]||0)+runAvail[n][k];const e=Math.min((runEat[n]||{})[k]||0,runAvail[n][k]);ea[k]=(ea[k]||0)+e;}}
  const ks=Object.keys(NUTRI).filter(k=>ea[k]>0);
  if(!ks.length)return{t:'Empty-Stomach Climber',c:'#C8C8D8'};
  const r=k=>ea[k]/av[k];
  const healthy=Object.keys(NUTRI).filter(k=>k!=='candy'&&av[k]>0);
  if(healthy.length>=4&&healthy.every(k=>r(k)>=0.6))return{t:'Balanced Gourmet',c:'#FFF3B0'};
  const top=ks.slice().sort((a,b)=>r(b)-r(a)||ea[b]-ea[a])[0];
  return{t:NUTRI[top][0],c:NUTRI[top][1]};}

  drawSummit(tier,clearT);

  if(clearT<2.8)return;
  const e=1-Math.pow(1-Math.min(1,(clearT-2.8)/0.5),3),X=Math.round(-210*(1-e));

  [1,2,3].forEach((n,i)=>{if(!show(3.1+i*0.2))return;const s=stageResults[n];txt(STAGES[n].name,28+X,108+i*15,6.2,{col:'#E4E4F0'});txt(s?('★'.repeat(s.starN)+'☆'.repeat(4-s.starN)):'—',150+X,108+i*15,6.2,{col:'#FFC21A',align:'right'});txt(s?s.total.toLocaleString('en-US'):'—',196+X,109+i*15,9,{font:'px',align:'right',col:'#FFFFFF'});});
  g.fillStyle='#FFC21A';g.fillRect(28+X,154,168,1);txt('Total',28+X,172,7.4,{col:'#FFC21A',bold:true});txt(Math.round(runScore*cnt).toLocaleString('en-US'),196+X,175,15,{font:'px',align:'right',col:'#FFC21A'});
  if(clearT>4.5){txt(practice?'Practice mode · records aren\'t saved':(r.newBest?'New best!':'Best '+(best?best.total.toLocaleString('en-US'):'—')),111+X,192,6,{align:'center',col:r.newBest?'#12C48B':'#C8C8D8'});
    txt(tot>=11?'11+ stars · a golden sun rises':tot>=7?'7+ stars · the sun rises (11 for gold)':'Collect 7 stars to raise the sun',111+X,207,5.6,{align:'center',col:'#9A9AB0'});
    txt('Space to title',111+X,224,6.4,{align:'center',col:'#FFFFFF',alpha:0.6+0.4*Math.sin(T*4)});}
  else txt('Space: skip',111+X,224,5.6,{align:'center',col:'#9A9AB0'});
  if(clearT>3.2)txt(tier===2?'A golden sun rises above the clouds.':tier===1?'The sun rises above the clouds.':'You made it, but the clouds are thick. More stars?',336,40,6.6,{align:'center',col:'#FFFFFF',bold:true});}

const cv=document.getElementById('game'),cx=cv.getContext('2d');let S=1,DPR=1;
// F: 녹화 모드 (전체화면 + 여백·조작 안내 숨김, 화면을 꽉 채움)
function toggleRec(){const on=!document.body.classList.contains('rec');document.body.classList.toggle('rec',on);
  try{if(on&&!document.fullscreenElement)document.documentElement.requestFullscreen().catch(()=>{});else if(!on&&document.fullscreenElement)document.exitFullscreen();}catch(e){}
  setTimeout(resize,60);setTimeout(resize,400);}
addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement&&document.body.classList.contains('rec')){document.body.classList.remove('rec');setTimeout(resize,60);}});
function resize(){const box=cv.parentElement.getBoundingClientRect();const avW=box.width,avH=Math.max(160,box.height);
  let s=Math.min(avW/W,avH/H);if(!document.body.classList.contains('rec')){if(s>=2)s=Math.floor(s);else if(s>=1)s=Math.floor(s*4)/4;}S=s;DPR=Math.min(2,window.devicePixelRatio||1);
  cv.style.width=Math.floor(W*s)+'px';cv.style.height=Math.floor(H*s)+'px';cv.width=Math.floor(W*s*DPR);cv.height=Math.floor(H*s*DPR);}
addEventListener('resize',resize);addEventListener('load',resize);try{new ResizeObserver(resize).observe(cv.parentElement);}catch(e){}
function wrapLines(s,maxW){const out=[];let cur='';for(const ch of s){const test=cur+ch;if(cx.measureText(test).width>maxW&&cur){const sp=cur.lastIndexOf(' ');if(sp>cur.length*0.5){out.push(cur.slice(0,sp));cur=cur.slice(sp+1)+ch;}else{out.push(cur);cur=ch;}}else cur=test;}if(cur)out.push(cur);return out;}
function blit(){cx.imageSmoothingEnabled=false;cx.setTransform(1,0,0,1,0,0);cx.drawImage(off,0,0,cv.width,cv.height);
  const k=S*DPR;cx.textBaseline='alphabetic';
  for(const t of texts){const x=t.x*k,y=(t.world?t.y-cam:t.y)*k;const size=t.size*k;
    cx.font=(t.font==='px'?`${Math.round(size*1.25)}px "Jersey 10", "Silkscreen", monospace`:`${t.bold?700:500} ${Math.round(size*1.15)}px "Noto Sans KR", system-ui, sans-serif`);
    cx.textAlign=t.align||'left';cx.globalAlpha=t.alpha==null?1:t.alpha;
    const lines=t.wrap?wrapLines(t.s,t.wrap*k):[t.s];
    lines.forEach((ln,i)=>{const yy=y+i*size*1.5;cx.fillStyle='rgba(10,10,20,0.85)';if(t.col!==INK)cx.fillText(ln,x+Math.max(1,k*0.6),yy+Math.max(1,k*0.6));cx.fillStyle=t.col||'#FFFFFF';cx.fillText(ln,x,yy);});
    cx.globalAlpha=1;}}
const STEP=1/120;let acc=0,last=performance.now();
let simMode=false;
function frame(now){if(simMode){render();blit();requestAnimationFrame(frame);return;}let fdt=Math.min(1/15,(now-last)/1000);last=now;if(hitstop>0){hitstop-=fdt;fdt=0;}acc+=fdt;let ran=false;while(acc>=STEP){update(STEP);acc-=STEP;if(!ran){ran=true;for(const k in pressed)pressed[k]=false;}}render();blit();requestAnimationFrame(frame);}

let running=false;function go(){if(running)return;running=true;last=performance.now();requestAnimationFrame(frame);}
fontsReady.then(go);setTimeout(go,1500);

window.__g={get pl(){return pl;},get state(){return state;},set state(v){state=v;},newRun,startStage,get plats(){return plats;},get foods(){return foods;},get gates(){return gates;},get score(){return score;},get runScore(){return runScore;},
  get rocks(){return rocks;},get falls(){return falls;},get ladders(){return ladders;},clearRocks(){rocks=[];falls=[];spawners.forEach(s=>s.t=999);fallT=999;},get cam(){return cam;},get wind(){return wind;},get stage(){return stageN;},setStats(o){if(o.time!=null)time=o.time;if(o.eaten!=null)eaten=o.eaten;if(o.food!=null){foodScore=o.food;}if(o.ox!=null)oxScore=o.ox;if(o.score!=null)score=o.score;},get introT(){return introT;},sim(n){simMode=true;for(let i=0;i<n;i++){update(STEP);for(const k in pressed)pressed[k]=false;if(state!=='play')break;}},set simMode(v){simMode=v;},get time(){return time;},get hearts(){return pl.hearts;},get fallN(){return fallN;},set introT(v){introT=v;},keys,pressed};
